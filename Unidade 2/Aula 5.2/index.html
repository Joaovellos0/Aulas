<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form action="">
      <div class="titulo">
        <h1>Formulário</h1>
        <p>
          Não te uma conta?
          <a href="">Registre-se</a>
        </p>
      </div>
      <div class="logos">
        <a href="" class="logo_google"
          ><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTM0Z-3HWrtSSiBhhEDRaT0HXgvxp98_plgA2rHlmjmCg&s=10
          alt="Goo" /></a
        >
        <a href="" class="logo_face"
          ><img
          src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRuci66Bma6ucZV8Q2XPfS-3Z1HElLnXIoBjd2VQUn_Xg&s=10
          alt="FA" /></a
        >
        <a href="" class="logo_git"
          ><img
          src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSd43NPXZcOp-N1vst9Acu-2IV7ZqJ3zQiOJpoW5YOOyg&s=10
          alt="GIT" /></a
        >
      </div>

      <input
        class="formulario"
        type="email"
        name=""
        id="email"
        placeholder="Email"
      />

      <input
        required
        class="formulario"
        type="password"
        name=""
        id="password"
        placeholder="Senha"
      />
      <div class="esqueceu">
        <a href="">Esqueceu a senha?</a>
      </div>
      <div class="botao">
        <input class="entrar" type="button" value="Entrar" />
      </div>
    </form>
  </body>
</html>
